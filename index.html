<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f4f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Trading Journal</title>
<style>
  :root{
    --bg:#f4f4f5;
    --panel:#ffffff;
    --cell:#ececee;
    --cell-empty:#ffffff;
    --border-light:#e6e6e9;
    --text:#111113;
    --text-sub:#9a9aa1;
    --green-bg:#e7f6ee;
    --green-border:#35a56b;
    --green-text:#1f9d61;
    --blue-bg:#e4e8fb;
    --blue-border:#4f5be0;
    --red-bg:#fbe4e6;
    --red-border:#e2707b;
    --purple:#5b4b9e;
    --dot:#e5484d;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding:0 10px 40px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 6px 14px;
  }
  .month-nav{display:flex;align-items:center;gap:4px;}
  .nav-btn{
    background:none;border:none;font-size:20px;color:var(--text);
    width:38px;height:38px;border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-btn:active{background:#e8e8ea;}
  #monthTitle{font-size:21px;font-weight:800;letter-spacing:-.3px;min-width:150px;text-align:center;}
  .header-icons{display:flex;gap:6px;}
  .icon-btn{
    background:none;border:none;font-size:19px;cursor:pointer;color:#3a3a3f;
    width:36px;height:36px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{background:#e8e8ea;}

  /* ---------- Stats ---------- */
  .stats-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:2px 6px 16px;
  }
  .stats-left{display:flex;align-items:center;gap:8px;}
  .stats-label{font-size:16px;font-weight:800;}
  .pill{
    padding:5px 12px;border-radius:11px;font-size:15px;font-weight:800;
  }
  .pill.pnl-pos{background:var(--green-bg);color:var(--green-text);}
  .pill.pnl-neg{background:var(--red-bg);color:#d5464e;}
  .pill.pnl-zero{background:#ececee;color:var(--text-sub);}
  .pill.days{background:#ecebf3;color:var(--text);font-weight:700;font-size:14px;}

  /* ---------- Calendar ---------- */
  .weekdays{
    display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;
  }
  .weekday{
    background:var(--panel);border:1px solid var(--border-light);
    border-radius:11px;text-align:center;
    font-size:12.5px;font-weight:700;padding:9px 0;
  }
  .grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:6px;
  }
  .cell{
    position:relative;
    background:var(--cell);
    border-radius:var(--radius);
    aspect-ratio:0.56;
    border:1.5px solid transparent;
    cursor:pointer;
    overflow:hidden;
    transition:transform .06s;
    display:flex;flex-direction:column;
    padding:5px 3px;
  }
  .cell:active{transform:scale(.96);}
  .cell.outside{
    background:var(--cell-empty);
    border:1px solid var(--border-light);
    cursor:default;
  }
  .cell .num{
    align-self:flex-end;margin:0 4px 0 0;
    font-size:12.5px;font-weight:600;color:var(--text);
    min-width:18px;height:18px;line-height:18px;text-align:center;
  }
  .cell.today .num{
    background:var(--purple);color:#fff;border-radius:50%;
    font-size:12px;
  }
  .cell.win{background:var(--green-bg);border-color:var(--green-border);}
  .cell.loss{background:var(--red-bg);border-color:var(--red-border);}
  .cell.be{background:var(--blue-bg);border-color:var(--blue-border);}
  .cell-data{
    text-align:right;margin-top:1px;padding-right:6px;
  }
  .cell-amount{
    font-size:10.5px;font-weight:800;letter-spacing:-.3px;
    color:var(--text);white-space:nowrap;line-height:1.15;
  }
  .cell-amount.long{font-size:9px;letter-spacing:-.4px;}
  .cell-rate{
    font-size:10px;font-weight:600;color:var(--text-sub);margin-top:2px;
  }
  .cell .dot{
    position:absolute;bottom:7px;right:8px;
    width:7px;height:7px;border-radius:50%;background:var(--dot);
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.4);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--panel);width:100%;max-width:520px;
    border-radius:24px 24px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:translateY(0);opacity:1}}
  .sheet h2{font-size:18px;font-weight:800;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12.5px;font-weight:700;color:var(--text-sub);
    margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;
  }
  .field input,.field textarea,.field select{
    width:100%;border:1.5px solid var(--border-light);border-radius:13px;
    padding:13px 14px;font-size:16px;font-family:inherit;background:#fafafa;
    outline:none;color:var(--text);
  }
  .field input:focus,.field textarea:focus{border-color:var(--purple);background:#fff;}
  .field textarea{resize:none;height:70px;}
  .quick-row{display:flex;gap:8px;margin-bottom:16px;}
  .quick{
    flex:1;border:1.5px solid var(--border-light);background:#fafafa;
    border-radius:13px;padding:11px 0;font-size:13.5px;font-weight:700;
    cursor:pointer;color:var(--text);font-family:inherit;
  }
  .quick.q-be.sel{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue-border);}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn{
    flex:1;border:none;border-radius:14px;padding:15px 0;
    font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .btn-save{background:var(--text);color:#fff;}
  .btn-delete{background:var(--red-bg);color:#d5464e;flex:0 0 30%;}
  .btn-cancel{background:#ececee;color:var(--text);flex:0 0 30%;}

  /* ---------- Settings ---------- */
  .set-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .set-row span{font-size:15px;font-weight:600;}
  .seg{display:flex;background:#ececee;border-radius:12px;padding:3px;}
  .seg button{
    border:none;background:none;padding:8px 18px;border-radius:10px;
    font-size:14px;font-weight:700;cursor:pointer;color:var(--text-sub);font-family:inherit;
  }
  .seg button.sel{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .io-row{display:flex;gap:8px;}
  .io-row .quick{padding:12px 0;}
</style>
</head>
<body>

<header>
  <button class="nav-btn" id="prevBtn">&#9664;&#xFE0E;</button>
  <div id="monthTitle"></div>
  <button class="nav-btn" id="nextBtn">&#9654;&#xFE0E;</button>
  <div class="header-icons">
    <button class="icon-btn" id="settingsBtn">&#9881;&#xFE0E;</button>
  </div>
</header>

<div class="stats-row">
  <div class="stats-left">
    <span class="stats-label">Stats du mois&nbsp;:</span>
    <span class="pill pnl-zero" id="pnlPill">0</span>
  </div>
  <span class="pill days" id="daysPill">0 jour</span>
</div>

<div class="weekdays" id="weekdays"></div>
<div class="grid" id="grid"></div>

<!-- ---- Modal jour ---- -->
<div class="overlay" id="dayOverlay">
  <div class="sheet">
    <h2 id="sheetTitle"></h2>
    <div class="quick-row">
      <button class="quick q-be" id="beBtn">Breakeven (0)</button>
    </div>
    <div class="field">
      <label>Profit / Perte (mets un - pour une perte)</label>
      <input type="text" inputmode="decimal" id="amountInput" placeholder="Ex : 2500 ou -340">
    </div>
    <div class="field">
      <label>Winrate %</label>
      <input type="text" inputmode="decimal" id="rateInput" placeholder="Ex : 100">
    </div>
    <div class="field">
      <label>Note</label>
      <textarea id="noteInput" placeholder="Remarques sur la journée…"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-cancel" id="cancelBtn">Annuler</button>
      <button class="btn btn-delete" id="deleteBtn">Effacer</button>
      <button class="btn btn-save" id="saveBtn">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ---- Modal réglages ---- -->
<div class="overlay" id="setOverlay">
  <div class="sheet">
    <h2>Réglages</h2>
    <div class="set-row">
      <span>Devise</span>
      <div class="seg" id="curSeg">
        <button data-cur="$">$</button>
        <button data-cur="€">€</button>
      </div>
    </div>
    <div class="set-row">
      <span>Sauvegarde</span>
      <div class="io-row">
        <button class="quick" id="exportBtn">Exporter</button>
        <button class="quick" id="importBtn">Importer</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <div class="btn-row">
      <button class="btn btn-save" id="setCloseBtn">Fermer</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORE_KEY='tradingJournal.v1';
  const state=load();
  let view=new Date();
  view.setDate(1);
  let editingKey=null;

  function load(){
    try{return JSON.parse(localStorage.getItem(STORE_KEY))||{currency:'$',days:{}};}
    catch(e){return {currency:'$',days:{}};}
  }
  function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}

  const MONTHS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const WD=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const wdEl=document.getElementById('weekdays');
  WD.forEach(d=>{const s=document.createElement('div');s.className='weekday';s.textContent=d;wdEl.appendChild(s);});

  function keyOf(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}

  function fmtMoney(v){
    const sign=v<0?'-':'';
    const a=Math.abs(v);
    let s;
    if(a>=1e6){s=trim((a/1e6).toPrecision(3))+'M';}
    else if(a>=1e4){s=trim((a/1e3).toPrecision(3))+'k';}
    else{s=trim(a.toFixed(2));}
    return sign+state.currency+s;
  }
  function trim(n){return String(parseFloat(n));}

  function render(){
    const y=view.getFullYear(),m=view.getMonth();
    document.getElementById('monthTitle').textContent=MONTHS[m]+' '+y;

    const grid=document.getElementById('grid');
    grid.innerHTML='';
    const first=new Date(y,m,1).getDay();
    const nDays=new Date(y,m+1,0).getDate();
    const today=new Date();
    const totalCells=Math.ceil((first+nDays)/7)*7;

    let total=0,count=0;

    for(let i=0;i<totalCells;i++){
      const cell=document.createElement('div');
      const d=i-first+1;
      if(d<1||d>nDays){
        cell.className='cell outside';
      }else{
        cell.className='cell';
        const k=keyOf(y,m,d);
        const num=document.createElement('div');
        num.className='num';num.textContent=d;
        cell.appendChild(num);
        if(d===today.getDate()&&m===today.getMonth()&&y===today.getFullYear()){
          cell.classList.add('today');
        }
        const e=state.days[k];
        if(e){
          count++;
          total+=e.amount;
          if(e.amount>0)cell.classList.add('win');
          else if(e.amount<0)cell.classList.add('loss');
          else cell.classList.add('be');
          const box=document.createElement('div');
          box.className='cell-data';
          const am=document.createElement('div');
          am.className='cell-amount';
          am.textContent=fmtMoney(e.amount);
          if(am.textContent.length>=8)am.classList.add('long');
          box.appendChild(am);
          if(e.rate!==null&&e.rate!==undefined&&e.rate!==''&&e.amount!==0){
            const r=document.createElement('div');
            r.className='cell-rate';
            r.textContent=parseFloat(e.rate).toFixed(1)+'%';
            box.appendChild(r);
          }
          cell.appendChild(box);
          if(e.note){
            const dot=document.createElement('div');dot.className='dot';cell.appendChild(dot);
          }
        }
        cell.addEventListener('click',()=>openDay(k,d,m,y));
      }
      grid.appendChild(cell);
    }

    const pnl=document.getElementById('pnlPill');
    pnl.textContent=total===0?state.currency+'0':fmtMoney(total);
    pnl.className='pill '+(total>0?'pnl-pos':total<0?'pnl-neg':'pnl-zero');
    document.getElementById('daysPill').textContent=count+(count>1?' jours':' jour');
  }

  /* ----- Day modal ----- */
  const dayOverlay=document.getElementById('dayOverlay');
  const amountInput=document.getElementById('amountInput');
  const rateInput=document.getElementById('rateInput');
  const noteInput=document.getElementById('noteInput');
  const beBtn=document.getElementById('beBtn');

  function openDay(k,d,m,y){
    editingKey=k;
    document.getElementById('sheetTitle').textContent=d+' '+MONTHS[m]+' '+y;
    const e=state.days[k];
    amountInput.value=e?String(e.amount):'';
    rateInput.value=e&&e.rate!==null&&e.rate!==undefined?e.rate:'';
    noteInput.value=e?(e.note||''):'';
    beBtn.classList.toggle('sel',!!e&&e.amount===0);
    document.getElementById('deleteBtn').style.display=e?'':'none';
    dayOverlay.classList.add('open');
  }
  function closeDay(){dayOverlay.classList.remove('open');editingKey=null;}

  beBtn.addEventListener('click',()=>{
    amountInput.value='0';
    beBtn.classList.add('sel');
  });
  amountInput.addEventListener('input',()=>{
    beBtn.classList.toggle('sel',amountInput.value.trim()==='0');
  });

  document.getElementById('saveBtn').addEventListener('click',()=>{
    const raw=amountInput.value.trim().replace(/\s/g,'').replace(',','.');
    if(raw===''){closeDay();return;}
    const amount=parseFloat(raw);
    if(isNaN(amount)){amountInput.style.borderColor='#e2707b';return;}
    const rateRaw=rateInput.value.trim().replace(',','.');
    state.days[editingKey]={
      amount:amount,
      rate:rateRaw===''?null:parseFloat(rateRaw),
      note:noteInput.value.trim()
    };
    save();closeDay();render();
  });
  document.getElementById('deleteBtn').addEventListener('click',()=>{
    delete state.days[editingKey];
    save();closeDay();render();
  });
  document.getElementById('cancelBtn').addEventListener('click',closeDay);
  dayOverlay.addEventListener('click',e=>{if(e.target===dayOverlay)closeDay();});

  /* ----- Settings ----- */
  const setOverlay=document.getElementById('setOverlay');
  const curSeg=document.getElementById('curSeg');
  function syncCur(){
    curSeg.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.cur===state.currency));
  }
  curSeg.addEventListener('click',e=>{
    if(e.target.dataset.cur){state.currency=e.target.dataset.cur;save();syncCur();render();}
  });
  document.getElementById('settingsBtn').addEventListener('click',()=>{syncCur();setOverlay.classList.add('open');});
  document.getElementById('setCloseBtn').addEventListener('click',()=>setOverlay.classList.remove('open'));
  setOverlay.addEventListener('click',e=>{if(e.target===setOverlay)setOverlay.classList.remove('open');});

  document.getElementById('exportBtn').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='trading-journal-backup.json';
    a.click();
  });
  const importFile=document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click',()=>importFile.click());
  importFile.addEventListener('change',()=>{
    const f=importFile.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data=JSON.parse(r.result);
        if(data&&data.days){state.days=data.days;state.currency=data.currency||state.currency;save();render();setOverlay.classList.remove('open');}
        else alert('Fichier invalide');
      }catch(e){alert('Fichier invalide');}
    };
    r.readAsText(f);
    importFile.value='';
  });

  /* ----- Navigation ----- */
  document.getElementById('prevBtn').addEventListener('click',()=>{view.setMonth(view.getMonth()-1);render();});
  document.getElementById('nextBtn').addEventListener('click',()=>{view.setMonth(view.getMonth()+1);render();});

  render();
})();
</script>
</body>
</html>
